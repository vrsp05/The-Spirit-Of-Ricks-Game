<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Spirit of Ricks</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%235b2a24%22/%3E%3Crect x=%224%22 y=%224%22 width=%228%22 height=%228%22 fill=%22%23f4ecdc%22/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="boot" aria-live="polite">
      <style>
        #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
          background: radial-gradient(ellipse at 50% 40%, #3a2a1c 0%, #1a120b 60%, #0c0805 100%); color: #f4ecdc; font-family: Georgia, 'Times New Roman', serif; transition: opacity .9s ease; }
        #boot.out { opacity: 0; pointer-events: none; }
        #boot .b-emblem { width: 64px; height: 64px; border: 3px solid #d9b13b; transform: rotate(45deg); display: grid; place-items: center; animation: bpulse 2.4s ease-in-out infinite; }
        #boot .b-emblem span { transform: rotate(-45deg); font: 700 26px Georgia, serif; color: #d9b13b; }
        #boot h1 { margin: 0; font-weight: 400; font-size: clamp(34px, 6vw, 64px); letter-spacing: .08em; text-align: center; padding: 0 16px;
          background: linear-gradient(180deg, #fff6dc, #d9b13b); -webkit-background-clip: text; background-clip: text; color: transparent; }
        #boot .b-sub { font: italic 16px Georgia, serif; color: #cdb98f; margin-top: -10px; text-align: center; padding: 0 16px; }
        #boot .b-bar { width: min(420px, calc(100vw - 48px)); height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
        #boot .b-fill { height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, #b8862b, #f2d27a); transition: width .35s ease; box-shadow: 0 0 12px rgba(242,210,122,.6); }
        #boot .b-step { font: 14px system-ui, sans-serif; color: #bfae8a; min-height: 1.4em; letter-spacing: .02em; }
        #boot .b-start { font: 600 18px system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #fff3c4; opacity: 0; transition: opacity .6s; animation: bblink 1.6s ease-in-out infinite; background: none; border: 0; cursor: pointer; padding: 10px 18px; }
        #boot .b-start.show { opacity: 1; }
        @keyframes bpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(217,177,59,.0); } 50% { box-shadow: 0 0 28px 4px rgba(217,177,59,.45); } }
        @keyframes bblink { 0%,100% { filter: brightness(1); } 50% { filter: brightness(.55); } }
      </style>
      <div class="b-emblem"><span>R</span></div>
      <h1>The Spirit of Ricks</h1>
      <div class="b-sub">Ricks College · BYU–Idaho · a legacy that continues</div>
      <div class="b-bar"><div class="b-fill"></div></div>
      <div class="b-step">Loading…</div>
      <button class="b-start" type="button" tabindex="-1">Press any button to start</button>
    </div>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
